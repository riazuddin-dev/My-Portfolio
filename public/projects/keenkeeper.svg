<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06080c"/>
      <stop offset="0.5" stop-color="#0c1218"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.45">
      <stop stop-color="#c49a6c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c49a6c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- board cards -->
  <g>
    <rect x="240" y="160" width="100" height="200" rx="8" fill="#c49a6c" fill-opacity="0.08" stroke="#c49a6c" stroke-opacity="0.45" stroke-width="1.2"/>
    <rect x="255" y="180" width="70" height="14" rx="3" fill="#c49a6c" fill-opacity="0.35"/>
    <rect x="255" y="210" width="70" height="28" rx="4" fill="#c49a6c" fill-opacity="0.12" stroke="#c49a6c" stroke-opacity="0.35"/>
    <rect x="255" y="250" width="70" height="28" rx="4" fill="#c49a6c" fill-opacity="0.12" stroke="#c49a6c" stroke-opacity="0.35"/>
    <rect x="255" y="290" width="70" height="28" rx="4" fill="#c49a6c" fill-opacity="0.12" stroke="#c49a6c" stroke-opacity="0.35"/>

    <rect x="350" y="160" width="100" height="200" rx="8" fill="#c49a6c" fill-opacity="0.12" stroke="#c49a6c" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="365" y="180" width="70" height="14" rx="3" fill="#c49a6c" fill-opacity="0.55"/>
    <rect x="365" y="210" width="70" height="28" rx="4" fill="#c49a6c" fill-opacity="0.15" stroke="#c49a6c" stroke-opacity="0.5"/>
    <rect x="365" y="250" width="70" height="28" rx="4" fill="#c49a6c" fill-opacity="0.15" stroke="#c49a6c" stroke-opacity="0.5"/>
    <rect x="365" y="290" width="70" height="28" rx="4" fill="#c49a6c" fill-opacity="0.15" stroke="#c49a6c" stroke-opacity="0.5"/>
    <!-- checkmark on one card -->
    <path d="M380 222 L390 232 L412 208" fill="none" stroke="#c49a6c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="460" y="160" width="100" height="200" rx="8" fill="#c49a6c" fill-opacity="0.08" stroke="#c49a6c" stroke-opacity="0.45" stroke-width="1.2"/>
    <rect x="475" y="180" width="70" height="14" rx="3" fill="#c49a6c" fill-opacity="0.35"/>
    <rect x="475" y="210" width="70" height="28" rx="4" fill="#c49a6c" fill-opacity="0.12" stroke="#c49a6c" stroke-opacity="0.35"/>
    <rect x="475" y="250" width="70" height="28" rx="4" fill="#c49a6c" fill-opacity="0.12" stroke="#c49a6c" stroke-opacity="0.35"/>
  </g>
  <text x="400" y="480" text-anchor="middle" fill="#c49a6c" font-family="Georgia, serif" font-size="26" letter-spacing="5" opacity="0.95">KEEN KEEPER</text>
  <text x="400" y="512" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" letter-spacing="3" opacity="0.45">PROJECT MANAGEMENT</text>
</svg>
