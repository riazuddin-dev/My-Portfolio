<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08060a"/>
      <stop offset="0.5" stop-color="#141018"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.35">
      <stop stop-color="#f0d9b5" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#c49a6c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#c49a6c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e8c9a0"/>
      <stop offset="1" stop-color="#c49a6c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#core)"/>
  <!-- light rings -->
  <circle cx="400" cy="250" r="90" stroke="url(#ring)" stroke-opacity="0.25" stroke-width="1" fill="none"/>
  <circle cx="400" cy="250" r="60" stroke="url(#ring)" stroke-opacity="0.4" stroke-width="1.5" fill="none"/>
  <circle cx="400" cy="250" r="30" stroke="url(#ring)" stroke-opacity="0.7" stroke-width="1.5" fill="#c49a6c" fill-opacity="0.15"/>
  <circle cx="400" cy="250" r="10" fill="#f0d9b5" fill-opacity="0.9"/>
  <!-- rays -->
  <g stroke="#c49a6c" stroke-opacity="0.3" stroke-width="1">
    <line x1="400" y1="130" x2="400" y2="160"/>
    <line x1="400" y1="340" x2="400" y2="370"/>
    <line x1="280" y1="250" x2="310" y2="250"/>
    <line x1="490" y1="250" x2="520" y2="250"/>
    <line x1="315" y1="165" x2="335" y2="185"/>
    <line x1="465" y1="315" x2="485" y2="335"/>
    <line x1="485" y1="165" x2="465" y2="185"/>
    <line x1="335" y1="315" x2="315" y2="335"/>
  </g>
  <text x="400" y="480" text-anchor="middle" fill="#c49a6c" font-family="Georgia, serif" font-size="30" letter-spacing="8" opacity="0.95">LUMINORK</text>
  <text x="400" y="512" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" letter-spacing="4" opacity="0.45">FULL-STACK APPLICATION</text>
</svg>
