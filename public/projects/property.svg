<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060a0c"/>
      <stop offset="0.55" stop-color="#0c1418"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c49a6c"/>
      <stop offset="1" stop-color="#9a7350"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop stop-color="#c49a6c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c49a6c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- buildings skyline -->
  <g fill="#c49a6c" fill-opacity="0.15" stroke="#c49a6c" stroke-opacity="0.55" stroke-width="1.5">
    <rect x="220" y="250" width="70" height="180" rx="2"/>
    <rect x="300" y="200" width="90" height="230" rx="2"/>
    <rect x="400" y="230" width="80" height="200" rx="2"/>
    <rect x="490" y="270" width="75" height="160" rx="2"/>
  </g>
  <!-- windows -->
  <g fill="#c49a6c" fill-opacity="0.55">
    <rect x="235" y="270" width="12" height="12" rx="1"/><rect x="255" y="270" width="12" height="12" rx="1"/><rect x="275" y="270" width="12" height="12" rx="1"/>
    <rect x="235" y="300" width="12" height="12" rx="1"/><rect x="255" y="300" width="12" height="12" rx="1"/><rect x="275" y="300" width="12" height="12" rx="1"/>
    <rect x="235" y="330" width="12" height="12" rx="1"/><rect x="255" y="330" width="12" height="12" rx="1"/>
    <rect x="320" y="220" width="14" height="14" rx="1"/><rect x="345" y="220" width="14" height="14" rx="1"/><rect x="370" y="220" width="14" height="14" rx="1"/>
    <rect x="320" y="250" width="14" height="14" rx="1"/><rect x="345" y="250" width="14" height="14" rx="1"/><rect x="370" y="250" width="14" height="14" rx="1"/>
    <rect x="320" y="280" width="14" height="14" rx="1"/><rect x="345" y="280" width="14" height="14" rx="1"/>
    <rect x="415" y="250" width="12" height="12" rx="1"/><rect x="435" y="250" width="12" height="12" rx="1"/><rect x="455" y="250" width="12" height="12" rx="1"/>
    <rect x="415" y="280" width="12" height="12" rx="1"/><rect x="435" y="280" width="12" height="12" rx="1"/>
    <rect x="505" y="290" width="12" height="12" rx="1"/><rect x="525" y="290" width="12" height="12" rx="1"/><rect x="545" y="290" width="12" height="12" rx="1"/>
  </g>
  <!-- ground line -->
  <line x1="180" y1="430" x2="620" y2="430" stroke="#c49a6c" stroke-opacity="0.4" stroke-width="1"/>
  <text x="400" y="500" text-anchor="middle" fill="#c49a6c" font-family="Georgia, serif" font-size="26" letter-spacing="5" opacity="0.9">PROPERTY</text>
  <text x="400" y="530" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" letter-spacing="4" opacity="0.45">REAL ESTATE PLATFORM</text>
