<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0806"/>
      <stop offset="0.5" stop-color="#14100c"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.45">
      <stop stop-color="#c49a6c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c49a6c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- soft heart / home shape -->
  <path d="M400 360 C340 310 280 270 280 220 C280 185 305 160 340 160 C365 160 385 172 400 192 C415 172 435 160 460 160 C495 160 520 185 520 220 C520 270 460 310 400 360 Z"
        fill="#c49a6c" fill-opacity="0.12" stroke="#c49a6c" stroke-opacity="0.7" stroke-width="1.5"/>
  <!-- paw print -->
  <g fill="#c49a6c" fill-opacity="0.75">
    <ellipse cx="400" cy="250" rx="22" ry="26"/>
    <ellipse cx="365" cy="215" rx="10" ry="14" transform="rotate(-20 365 215)"/>
    <ellipse cx="385" cy="200" rx="10" ry="14" transform="rotate(-5 385 200)"/>
    <ellipse cx="415" cy="200" rx="10" ry="14" transform="rotate(5 415 200)"/>
    <ellipse cx="435" cy="215" rx="10" ry="14" transform="rotate(20 435 215)"/>
  </g>
  <text x="400" y="480" text-anchor="middle" fill="#c49a6c" font-family="Georgia, serif" font-size="24" letter-spacing="4" opacity="0.95">PET ADOPTION</text>
  <text x="400" y="512" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" letter-spacing="4" opacity="0.45">FIND A FOREVER HOME</text>
</svg>
